[project]
name = "kokoro-tts-pipeline"
version = "0.1.0"
description = "DIMER inference pipeline for hexgrad/Kokoro-82M text-to-speech (24 kHz mono, selectable voice packs)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "kokoro==0.9.4",
  "misaki==0.9.4",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "torchaudio==2.11.0",
  "numpy==2.5.3",
  "huggingface-hub==0.36.2",
  "soundfile==0.14.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kokoro_tts_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
